<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로또 번호 추첨기</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fef3c7, #dbeafe);
      color: #111827;
    }
    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      padding: 28px;
      text-align: center;
      width: 420px;
      max-width: 90vw;
    }
    h1 { margin-top: 0; font-size: 24px; }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      margin: 8px 0 12px;
    }
    button:hover { background: #1d4ed8; }
    .buttons { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    #result {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 2px;
      min-height: 32px;
      margin-bottom: 10px;
    }
    .settings {
      margin-top: 12px;
      text-align: left;
      font-size: 13px;
      color: #4b5563;
    }
    .settings input {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      margin-bottom: 8px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      box-sizing: border-box;
    }
    .status {
      margin-top: 10px;
      font-size: 14px;
      min-height: 20px;
    }
    .status.success { color: #15803d; }
    .status.error { color: #dc2626; }
    .hint { margin-top: 10px; font-size: 12px; color: #6b7280; }
  </style>
</head>
<body>
  <div class="card">
    <h1>로또 번호 추첨기</h1>
    <div class="buttons">
      <button onclick="generateNumbers()">번호 추첨</button>
      <button onclick="saveToSupabase()">생성한 번호 저장</button>
    </div>
    <div id="result">클릭해 주세요</div>

    <div class="settings">
      <label>Supabase URL</label>
      <input id="supabaseUrl" placeholder="https://xxxx.supabase.co" />

      <label>Supabase anon key</label>
      <input id="supabaseKey" placeholder="your-anon-key" />

      <label>테이블 이름</label>
      <input id="tableName" value="lotto_results" />
    </div>

    <div id="status" class="status"></div>
    <div class="hint">테이블 예시: numbers text, created_at timestamp with time zone default now()</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    let latestNumbers = [];

    function generateNumbers() {
      const numbers = [];
      while (numbers.length < 6) {
        const n = Math.floor(Math.random() * 45) + 1;
        if (!numbers.includes(n)) numbers.push(n);
      }
      numbers.sort((a, b) => a - b);
      latestNumbers = numbers;
      document.getElementById('result').textContent = numbers.join('  ');
      setStatus('번호가 생성되었습니다.', 'success');
    }

    function setStatus(message, type = '') {
      const statusEl = document.getElementById('status');
      statusEl.textContent = message;
      statusEl.className = `status ${type}`.trim();
    }

    async function saveToSupabase() {
      if (latestNumbers.length === 0) {
        setStatus('먼저 번호를 생성해 주세요.', 'error');
        return;
      }

      const supabaseUrl = document.getElementById('supabaseUrl').value.trim();
      const supabaseKey = document.getElementById('supabaseKey').value.trim();
      const tableName = document.getElementById('tableName').value.trim() || 'lotto_results';

      if (!supabaseUrl || !supabaseKey) {
        setStatus('Supabase URL과 anon key를 입력해 주세요.', 'error');
        return;
      }

      try {
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
        const { error } = await supabase.from(tableName).insert([
          { numbers: latestNumbers.join(',') }
        ]);

        if (error) {
          throw error;
        }

        setStatus(`저장 완료: ${latestNumbers.join(' ')}`, 'success');
      } catch (error) {
        console.error(error);
        setStatus(`저장 실패: ${error.message || '알 수 없는 오류'}`, 'error');
      }
    }
  </script>
</body>
</html>
